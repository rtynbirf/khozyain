name: ХОЗЯИН · ночной обход дома

on:
  schedule:
    - cron: "0 4 * * *"   # ежедневно 04:00 UTC — дом сверяется со средой
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: khozyain-sweep
  cancel-in-progress: false

jobs:
  sweep:
    # Клетка A (2026-11-24, слияние 4 клеток): срез пишется рукой самого репо
    # (GITHUB_TOKEN, job contents:write) — мёртвая SWARM_TOKEN больше не убивает
    # летопись. Замер I1–I3 идёт по публичной витрине дома (все тела публичны);
    # I4 (уведомления) честно помечается «не измерен», если рука без
    # user-контекста — ложный «0» запрещён. pipefail: замер, упавший с трейсбеком,
    # больше не может притворяться зелёным через tee (рана #6).
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: ночной обход (замер инвариантов I1–I4 по живому API)
        env:
          GH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}   # тонкая рука роя, если Хозяин выдаст; иначе рука репо
        run: |
          set -o pipefail
          python3 scripts/khozyain_sweep.py | tee sweep_out.txt

      - name: строгий приговор (REJECT при тревогах — честный красный)
        run: |
          if grep -q "ТРЕВОГИ" sweep_out.txt; then
            echo "REJECT: у дома тревоги — срез выше, ремонт по ритуалу domovoy-ritual"
            exit 1
          fi
          echo "ДОМ ЧИСТ: инварианты держатся"

      - name: срез в летопись дома (append-only, рука репо)
        env:
          PUSH_TOKEN: ${{ secrets.SWARM_TOKEN || github.token }}
        run: |
          rm -f sweep_out.txt
          printf '\n<!-- срез %s -->\n' "$(date -u +%FT%TZ)" >> HOUSE_STATE.md
          python3 scripts/khozyain_sweep.py > /tmp/final_slice.txt || true
          cat /tmp/final_slice.txt >> HOUSE_STATE.md
          git config user.name "khozyain-machine"
          git config user.email "machine@users.noreply.github.com"
          git add HOUSE_STATE.md
          if git diff --cached --quiet; then
            echo "срез без изменений — дом в покое"
          else
            git commit -m "ХОЗЯИН: ночной срез $(date -u +%FT%TZ) — append-only"
            git pull --rebase origin main
            # волна 14: extraheader от checkout перекрывает URL-креды → снимаем в обоих скоупах
            git config --unset-all http.https://github.com/.extraheader || true
            git config --worktree --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
